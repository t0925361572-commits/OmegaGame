<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馬上 RICH 吉運來 - 2026馬年精緻版</title>
<style>
    :root {
        --primary-red: #c9182b; /* 中國紅 */
        --dark-red: #8a0a16;
        --gold: #ffd700;
        --gold-dark: #ccac00;
        --bg-color: #fff5f5;
        --text-color: #2b2d42;
        --success-color: #2a9d8f;
        --error-color: #ef233c;
        --boutique-color: #1a3c6e; 
        --domestic-color: #c9182b;
    }
    body {
        font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-color);
        /* 祥雲背景紋理 */
        background-image: 
            radial-gradient(var(--gold) 15%, transparent 16%),
            radial-gradient(var(--gold) 15%, transparent 16%);
        background-size: 30px 30px;
        background-position: 0 0, 15px 15px;
        background-blend-mode: overlay;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        color: var(--text-color);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
    }
    /* 降低背景干擾 */
    body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 245, 245, 0.95);
        z-index: -1;
    }

    .app-container {
        width: 100%;
        max-width: 480px;
        background: #fff;
        min-height: 100vh;
        box-shadow: 0 0 40px rgba(201, 24, 43, 0.2);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }
    
    /* === Header & Title === */
    .header {
        text-align: center;
        padding: 60px 20px 20px; /* 增加上方留白給馬跑 */
        background: linear-gradient(180deg, #fff 0%, #fff0f0 100%);
        border-bottom: 2px solid #ffebeb;
        position: relative;
    }
    
    .brand-tag {
        display: inline-block;
        background: var(--dark-red);
        color: var(--gold);
        padding: 4px 16px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 0.85em;
        letter-spacing: 2px;
        margin-bottom: 25px; /* 增加間距 */
        border: 1px solid var(--gold);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .title-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 15px;
    }

    .title-box {
        background: var(--primary-red);
        color: #fff;
        padding: 15px 35px;
        border-radius: 15px;
        box-shadow: 5px 5px 0 var(--gold-dark);
        border: 2px solid var(--gold);
        position: relative;
        z-index: 2;
    }

    /* 燈籠裝飾 */
    .lantern {
        position: absolute;
        bottom: -15px; /* 改到底部垂掛 */
        font-size: 24px;
        animation: swing 3s ease-in-out infinite;
        z-index: 1;
    }
    .lantern-left { left: 10px; transform-origin: top center; }
    .lantern-right { right: 10px; transform-origin: top center; animation-delay: 1.5s; }

    @keyframes swing {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
    }

    h1.main-title {
        font-size: 1.8em;
        margin: 0;
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        line-height: 1.2;
    }
    h2.sub-title {
        color: var(--dark-red);
        font-size: 1.1em;
        margin-top: 20px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* === Cute Horse Animation === */
    .horse-container {
        position: absolute;
        top: -45px; /* 站在標題上面 */
        left: 0;
        width: 100%;
        height: 50px;
        pointer-events: none;
        z-index: 3;
    }
    .cute-horse {
        font-size: 42px;
        position: absolute;
        /* 馬的跑步動畫：左右來回 + 上下跳動 */
        animation: run-cycle 6s linear infinite;
        filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
    }

    @keyframes run-cycle {
        0% { left: 0%; transform: scaleX(-1) translateY(0); } /* 面向右跑 */
        45% { left: 85%; transform: scaleX(-1) translateY(-5px); } /* 跑到右邊 */
        50% { left: 85%; transform: scaleX(1) translateY(0); } /* 轉向左 */
        95% { left: 0%; transform: scaleX(1) translateY(-5px); } /* 跑到左邊 */
        100% { left: 0%; transform: scaleX(-1) translateY(0); } /* 轉向右 */
    }

    /* === Input & Cards === */
    .card-panel {
        margin: 20px 25px;
        background: white;
        padding: 30px 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(201, 24, 43, 0.08);
        border: 1px solid #ffe5e5;
        text-align: center;
    }
    
    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .input-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: var(--dark-red);
        font-size: 0.95em;
    }
    .input-group input {
        width: 100%;
        padding: 14px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 1.1em;
        box-sizing: border-box;
        transition: all 0.3s;
        background: #fafafa;
    }
    .input-group input:focus {
        border-color: var(--primary-red);
        background: #fff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(201, 24, 43, 0.1);
    }

    /* === Quiz UI === */
    .progress-bar-container {
        height: 10px;
        background: #eee;
        width: 100%;
    }
    .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--gold), var(--primary-red));
        width: 0%;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 0 5px 5px 0;
    }
    
    .question-card {
        padding: 25px;
        background: #fff;
    }
    .q-text {
        font-weight: bold;
        font-size: 1.25em;
        margin-bottom: 30px;
        line-height: 1.6;
        color: #2b2d42;
    }
    
    .option {
        display: flex;
        align-items: center;
        padding: 18px 15px;
        margin-bottom: 15px;
        background: #fff;
        border: 2px solid #f0f0f0;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 1.05em;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .option:active { transform: scale(0.98); }
    .option.selected {
        border-color: var(--primary-red);
        background: #fff0f3;
        color: var(--dark-red);
        font-weight: bold;
        box-shadow: 0 4px 12px rgba(201, 24, 43, 0.15);
    }

    .option-circle {
        width: 24px;
        height: 24px;
        border: 2px solid #ccc;
        border-radius: 50%;
        margin-right: 15px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .option.selected .option-circle {
        border-color: var(--primary-red);
        background: var(--primary-red);
    }

    /* === Buttons === */
    .btn-area {
        padding: 20px;
        background: #fff;
        border-top: 1px solid #ffe5e5;
        margin-top: auto;
    }
    .btn {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 50px;
        font-size: 1.15em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 15px;
        letter-spacing: 1px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
    }
    .btn:active { transform: scale(0.97); }

    .btn-start {
        background: linear-gradient(135deg, var(--primary-red), #ff4d6d);
        color: white;
        font-size: 1.2em;
        box-shadow: 0 8px 20px rgba(201, 24, 43, 0.3);
    }

    .btn-boutique { background: linear-gradient(135deg, #003049, #023e8a); color: white; }
    .btn-domestic { background: linear-gradient(135deg, #d00000, #9d0208); color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-outline { background: #fff; border: 2px solid var(--primary-red); color: var(--primary-red); }
    .btn-text { background: transparent; color: #888; font-size: 0.95em; padding: 10px; box-shadow: none; text-decoration: underline; }
    
    /* Result & Leaderboard Styles */
    .result-header {
        background: linear-gradient(135deg, #d90429 0%, #8d0801 100%);
        color: white;
        padding: 40px 20px 50px;
        text-align: center;
        border-radius: 0 0 40px 40px;
        margin-bottom: 20px;
    }
    .score-big { font-size: 5em; font-weight: 800; margin: 10px 0; }
    
    .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
    .leaderboard-table td { padding: 15px 10px; background: #fff; }
    .rank-num {
        display: inline-block; width: 30px; height: 30px; line-height: 30px;
        text-align: center; background: #eee; border-radius: 50%;
    }
    .rank-1 { background: #FFD700; color: #fff; }

</style>
</head>

    const domesticSpecificQuestions = [
        { q: "國產滿額現抵：單筆滿 $1,880 可以現抵多少？", options: ["(A) $100", "(B) $150", "(C) $200"], a: 1 },
        { q: "國產單筆滿額 $3,000 可以現抵回饋多少？", options: ["(A) $250", "(B) $300", "(C) $350"], a: 1 },
        { q: "國產單筆滿 $3,000 後，每滿 $1,000 以此類推回饋幾%？", options: ["(A) 10%", "(B) 8%", "(C) 12%"], a: 0 },
        { q: "2/1 開跑活動，單筆滿 $1,000 可獲得？", options: ["(A) 抽獎券乙張", "(B) 抵用券乙張", "(C) 紅包袋"], a: 0 }
    ];

    function shuffleArray(array) {
        let newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    // --- 頁面切換與邏輯函式 ---

    // 1. 執行登入 (驗證並切換到選單)
    window.performLogin = function() {
        // 使用工號與部門
        const id = document.getElementById('inputId').value.trim();
        const dept = document.getElementById('inputDept').value.trim();

        if (!id || !dept) {
            alert("⚠️ 請先輸入「工號」與「部門」！");
            return;
        }
        // userInfo 的 name 欄位改存 ID，以便與後端/排行榜邏輯相容
        userInfo = { name: id, dept: dept };
        
        document.getElementById('welcomeText').innerText = `Hi, ${id}`;
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('menuView').style.display = 'flex';
    }

    // 2. 開始測驗
    window.startQuiz = function(type) {
        currentQuizType = type;

        // 組合題庫
        let specificQs = (type === 'boutique') ? boutiqueSpecificQuestions : domesticSpecificQuestions;
        let fullSet = [...specificQs, ...commonQuestions];
        let shuffledSet = shuffleArray(fullSet);
        currentQuestions = shuffledSet.slice(0, 20);
        
        currentQIndex = 0;
        score = 0;
        userAnswers = [];

        // UI Update
        document.getElementById('menuView').style.display = 'none';
        document.getElementById('quizView').style.display = 'flex';
        document.getElementById('totalQNum').innerText = currentQuestions.length;
        
        let tag = document.getElementById('quizSubjectTag');
        let nextBtn = document.getElementById('nextBtn');
        
        if (type === 'boutique') {
            tag.innerText = "精品重點";
            tag.style.background = "#003049";
            tag.style.color = "#fff";
            nextBtn.className = "btn btn-boutique";
        } else {
            tag.innerText = "國產/香化";
            tag.style.background = "#d00000";
            tag.style.color = "#fff";
            nextBtn.className = "btn btn-domestic";
        }

        window.loadQuestion();
    }

    window.loadQuestion = function() {
        let qData = currentQuestions[currentQIndex];
        let container = document.getElementById('questionContainer');
        
        document.getElementById('currentQNum').innerText = currentQIndex + 1;
        let progressPercent = ((currentQIndex + 1) / currentQuestions.length) * 100;
        document.getElementById('progressBar').style.width = progressPercent + "%";

        container.innerHTML = `
            <div class="question-card">
                <div class="q-text">${qData.q}</div>
                <div class="options-list">
                    ${qData.options.map((opt, index) => `
                        <div class="option" onclick="window.selectOption(this, ${index})">
                            <div class="option-circle"></div>
                            <div>${opt}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        
        let nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        nextBtn.style.opacity = "0.6";
        nextBtn.innerText = (currentQIndex === currentQuestions.length - 1) ? "送出試卷" : "下一題";
        selectedOptionIndex = null;
        container.scrollTop = 0;
    }

    window.selectOption = function(element, index) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        selectedOptionIndex = index;
        let nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = false;
        nextBtn.style.opacity = "1";
    }

    window.nextQuestion = function() {
        if (selectedOptionIndex === null) return;

        let currentQ = currentQuestions[currentQIndex];
        let isCorrect = (selectedOptionIndex === currentQ.a);
        if (isCorrect) score++;
        
        userAnswers.push({
            question: currentQ.q,
            userSelect: currentQ.options[selectedOptionIndex],
            correctSelect: currentQ.options[currentQ.a],
            isCorrect: isCorrect
        });

        if (currentQIndex < currentQuestions.length - 1) {
            currentQIndex++;
            window.loadQuestion();
        } else {
            window.showResult();
        }
    }

    window.showResult = function() {
        document.getElementById('quizView').style.display = 'none';
        document.getElementById('resultView').style.display = 'flex';

        let finalScore = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('finalScore').innerText = finalScore;
        let typeName = (currentQuizType === 'boutique') ? "(精)" : "(國)";
        document.getElementById('displayUserInfo').innerText = `${userInfo.name} / ${userInfo.dept} ${typeName}`;

        window.saveToLeaderboard(userInfo.name, userInfo.dept + " " + typeName, finalScore);

        let reviewHtml = "";
        userAnswers.forEach((ans, idx) => {
            let statusClass = ans.isCorrect ? "correct" : "wrong";
            let statusBadge = ans.isCorrect ? 
                `<span style="color:#2a9d8f;">⭕</span>` : 
                `<span style="color:#ef233c;">❌</span>`;
            let explanation = ans.isCorrect ? "" : `<div style="margin-top:8px; color:#c9182b; font-weight:bold; padding:5px; background:#fff0f0; border-radius:4px; font-size:0.9em;">正解：${ans.correctSelect}</div>`;

            reviewHtml += `
                <div class="review-item ${statusClass}">
                    <div class="review-q">${statusBadge} ${idx + 1}. ${ans.question}</div>
                    <div class="review-ans">
                        你的選擇：${ans.userSelect}
                        ${explanation}
                    </div>
                </div>
            `;
        });
        document.getElementById('reviewContainer').innerHTML = reviewHtml;
    }

    window.copyResultText = function() {
        let finalScore = Math.round((score / currentQuestions.length) * 100);
        let typeText = (currentQuizType === 'boutique') ? "精品重點" : "國產/香化";
        let text = `【${typeText}測驗結果】\n工號：${userInfo.name}\n部門：${userInfo.dept}\n分數：${finalScore} 分\n日期：${new Date().toLocaleDateString()}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ 成績已複製！\n請直接到 LINE 對話框貼上即可。");
            }).catch(err => {
                window.fallbackCopyTextToClipboard(text);
            });
        } else {
            window.fallbackCopyTextToClipboard(text);
        }
    }

    window.fallbackCopyTextToClipboard = function(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            var successful = document.execCommand('copy');
            if (successful) {
                alert("✅ 成績已複製！\n請直接到 LINE 對話框貼上即可。");
            } else {
                alert("⚠️ 複製失敗，可能是手機系統限制。\n請直接「螢幕截圖」傳送。");
            }
        } catch (err) {
            alert("⚠️ 複製失敗，請直接「螢幕截圖」傳送。");
        }
        document.body.removeChild(textArea);
    }

    window.backToLogin = function() {
        document.getElementById('menuView').style.display = 'none';
        document.getElementById('leaderboardView').style.display = 'none';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('loginView').style.display = 'flex';
        // 不清空資料，方便重測
    }

    // === Firebase Functions ===

    window.saveToLeaderboard = async function(name, dept, score) {
        try {
            await addDoc(collection(db, "quiz_leaderboard_2026"), {
                name: name,
                dept: dept,
                score: score,
                timestamp: Date.now()
            });
            console.log("Score saved!");
        } catch (e) {
            console.error("Error adding document: ", e);
            alert("無法上傳成績，請檢查網路或聯繫管理員。");
        }
    }

    window.showLeaderboard = async function() {
        // Hide all views first
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('menuView').style.display = 'none';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('leaderboardView').style.display = 'flex';

        let tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:#aaa;">雲端資料讀取中...</td></tr>`;

        try {
            // 改為一次抓取所有資料，然後在前端排序，避免 Firebase 索引問題
            const querySnapshot = await getDocs(collection(db, "quiz_leaderboard_2026"));
            
            let data = [];
            querySnapshot.forEach((doc) => {
                data.push(doc.data());
            });

            // 前端排序：分數高 -> 低，時間早 -> 晚
            data.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.timestamp - b.timestamp;
            });

            // 取前 10 名
            data = data.slice(0, 10);
            
            tbody.innerHTML = "";
            let rank = 1;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:#aaa;">尚無紀錄<br>快來當第一個挑戰者！</td></tr>`;
                return;
            }

            data.forEach((item) => {
                let rankClass = "";
                if (rank === 1) rankClass = "rank-1";
                
                tbody.innerHTML += `
                    <tr>
                        <td><span class="rank-num ${rankClass}">${rank}</span></td>
                        <td style="font-weight:bold; color:#555;">${item.name}</td>
                        <td style="font-size:0.85em; color:#888;">${item.dept}</td>
                        <td style="font-weight:bold; color:#d90429; font-size:1.1em;">${item.score}</td>
                    </tr>
                `;
                rank++;
            });

        } catch (e) {
            console.error("Error fetching leaderboard: ", e);
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:red;">無法讀取排行榜</td></tr>`;
        }
    }
</script>
