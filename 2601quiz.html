<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 新春銷售大會考</title>
    
    <!-- 載入基礎庫 (全域變數版，最穩定) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase Compat 版本 (相容性最高) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .btn-active:active { transform: scale(0.98); }
        .quiz-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    </style>
</head>
<body>
    <!-- 預防白屏的基礎 HTML -->
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-weight:bold; color:#666;">
            系統載入中，請稍候...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ✅ 您提供的專屬 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCcRFWrx2qkUUFCm_fi5rU-DH8zkhiHvtw",
            authDomain: "quiz-5a0b1.firebaseapp.com",
            projectId: "quiz-5a0b1",
            storageBucket: "quiz-5a0b1.firebasestorage.app",
            messagingSenderId: "301759727206",
            appId: "1:301759727206:web:9bb541130caacdd6108fa7",
            measurementId: "G-MFPNWYY60W"
        };

        // 初始化 Firebase
        let db = null;
        try {
            if (!firebase.apps.length) {
                const app = firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebase.auth().signInAnonymously();
            } else {
                db = firebase.firestore();
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const ALL_QUESTIONS = [
            { id: 1, category: 'domestic', question: '國產滿額現抵活動：單筆滿 $1,880 可以現抵多少？', options: ['$150', '$200', '$250', '$300'], correct: 2 },
            { id: 2, category: 'domestic', question: '國產滿額現抵活動：單筆滿 $3,000 可以現抵多少？', options: ['$250', '$300', '$350', '$400'], correct: 1 },
            { id: 3, category: 'domestic', question: '國產單筆滿額 $3,000，每滿 $1,000 以此類推，換算回饋率約為幾 %？', options: ['8%', '10%', '12%', '15%'], correct: 1 },
            { id: 4, category: 'domestic', question: '2/1 開跑活動，單筆滿 $1,000 可獲得什麼？', options: ['1元賀卡', '馬年紅包袋', '抽獎券乙張', '抵用券'], correct: 2 },
            { id: 27, category: 'domestic', question: '若國產單筆消費滿 $5,000 (依每滿千推算)，可現抵回饋多少？', options: ['$400', '$500', '$600', '$450'], correct: 1 },
            { id: 28, category: 'domestic', question: '若國產單筆消費滿 $8,000 (依每滿千推算)，可現抵回饋多少？', options: ['$700', '$800', '$750', '$900'], correct: 1 },
            { id: 29, category: 'domestic', question: '國產滿額現抵的回饋計算方式是？', options: ['滿$3,000送$200', '每滿$1,000現抵10%', '滿$5,000送$600', '無累計'], correct: 1 },
            { id: 13, category: 'boutique', question: '03/04/05/06 大類 (皮件/眼鏡/珠寶/錶) 基本門檻滿 $8,000 現抵多少？', options: ['$500', '$600', '$650', '$800'], correct: 2 },
            { id: 31, category: 'boutique', question: '03/04/05/06 大類 (皮件/眼鏡/珠寶/錶) 滿 $18,000 現抵多少？', options: ['$1,200', '$1,300', '$1,400', '$1,500'], correct: 1 },
            { id: 32, category: 'boutique', question: '03/04/05/06 大類 (皮件/眼鏡/珠寶/錶) 滿 $25,000 現抵多少？', options: ['$2,000', '$2,200', '$2,400', '$2,500'], correct: 2 },
            { id: 33, category: 'boutique', question: '03/04/05/06 大類 (皮件/眼鏡/珠寶/錶) 滿 $50,000 現抵多少？', options: ['$4,000', '$4,500', '$4,800', '$5,000'], correct: 2 },
            { id: 14, category: 'boutique', question: '03/04/05/06 大類 (皮件/眼鏡/珠寶/錶) 滿 $100,000 現抵多少？', options: ['$8,800', '$9,000', '$9,600', '$10,000'], correct: 2 },
            { id: 16, category: 'boutique', question: '03/04/05/06 大類單筆滿 $32,800 贈送什麼？', options: ['掛繩包', '香盅禮盒', '行李箱', 'SWITCH 2'], correct: 0 },
            { id: 17, category: 'boutique', question: '全館當日累計滿 $500,000 贈送什麼大獎？', options: ['純金紅繩手鏈', 'I-PHLOE 17 PRO', 'SWITCH 2 單機版', '東京來回機票'], correct: 2 },
            { id: 18, category: 'boutique', question: '全館當日累計滿 $1,000,000 贈送什麼頂級好禮？', options: ['純金紅繩手鏈', 'I-PHLOE 17 PRO 256G', 'SWITCH 2', '重機乙台'], correct: 1 },
            { id: 19, category: 'boutique', question: 'Rich Point 點數發放：全館當日累計滿 $150,000 送幾點？', options: ['15,000點', '30,000點', '45,000點', '50,000點'], correct: 2 },
            { id: 5, category: 'common', question: '1/10 第一波會員來店禮是？', options: ['馬年紅包袋', '轉運貼紙', '1元賀卡', '香盅禮盒'], correct: 1 },
            { id: 6, category: 'common', question: '2/1 第二波會員來店禮是？', options: ['馬年紅包袋', '轉運貼紙', '掛繩包', '純金紅繩手鏈'], correct: 0 },
            { id: 34, category: 'common', question: '2/16 第三波會員來店禮是？', options: ['轉運貼紙', '1元賀卡', '馬年紅包袋', '掛繩包'], correct: 1 },
            { id: 7, category: 'common', question: '關於銀行刷卡滿額禮，通常是否包含「菸酒藥類」的消費金額？', options: ['包含', '不包含', '視銀行而定', '僅包含酒類'], correct: 1 },
            { id: 23, category: 'common', question: 'Rich Point 點數何時統一派發？', options: ['消費當下', '每週一', '每週三', '每月1號'], correct: 2 },
            { id: 24, category: 'common', question: '全館滿額贈及點數兌換，統一於何處辦理？', options: ['各專櫃', '服務台', '客服櫃檯', '線上兌換'], correct: 2 },
            { id: 25, category: 'boutique', question: '全館滿額贈是否包含「黃金及特價珠寶手錶」的消費？', options: ['不包含', '包含', '僅包含黃金', '僅包含手錶'], correct: 1 },
            { id: 35, category: 'common', question: '全館當日累計滿 $300,000 贈送什麼？', options: ['SWITCH 2', '純金紅繩手鏈', '香盅禮盒', '掛繩包'], correct: 1 },
            { id: 8, category: 'common', question: '台新銀行 2026 Q1 活動，單日累積滿 $22,000 現場贈送？', options: ['香氛禮盒', '阿原艾草旅行組乙組', '掛繩包', '25吋行李箱'], correct: 1 },
            { id: 9, category: 'common', question: '台新銀行 2026 Q1 活動，單日累積滿 $68,000 贈送？', options: ['香氛禮盒', '25吋上掀旅行箱', 'SWITCH 2', '純金紅繩手鏈'], correct: 1 },
            { id: 36, category: 'common', question: '台新銀行刷卡滿 $160,000 送的 $2,000 是什麼形式？', options: ['現金', '禮券', '刷卡金', '點數'], correct: 1 },
            { id: 10, category: 'common', question: '台新銀行獨家「$888 送台新 1 元發財金」活動，限定日期區間為何？', options: ['1/10 - 2/24', '2/13 - 2/22', '2/1 - 2/15', '1/1 - 1/31'], correct: 1 },
            { id: 20, category: 'common', question: '台新銀行昇恆昌聯名卡滿 $160,000 送 $2,000 禮券，「高雄機場」限量幾份？', options: ['10 份', '20 份', '50 份', '100 份'], correct: 0 },
            { id: 21, category: 'common', question: '星展銀行滿 10 萬送 $2,000 刷卡金，需符合哪種付款條件？', options: ['單筆付清', '分期累積', '限制Apple Pay', '限制現金回饋卡'], correct: 1 },
            { id: 22, category: 'common', question: '兆豐銀行滿 10 萬送 $900 刷卡金，需符合哪種付款條件？', options: ['單日累積分期', '單筆付清', '不限', '需登錄'], correct: 0 },
            { id: 37, category: 'common', question: '哪一家銀行推出「$888 送 1 元發財金」活動？', options: ['星展銀行', '兆豐銀行', '台新銀行', '國泰世華'], correct: 2 }
        ];

        const App = () => {
            const [employeeId, setEmployeeId] = useState('');
            const [view, setView] = useState('login');
            const [currentMode, setCurrentMode] = useState(null);
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [isChecked, setIsChecked] = useState(false);
            const [leaderboard, setLeaderboard] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const resRef = useRef();

            useEffect(() => {
                if (db) {
                    const unsub = db.collection('quiz_data_v1').onSnapshot(snap => {
                        const data = snap.docs.map(doc => doc.data());
                        setLeaderboard(data);
                    }, err => console.error("Snapshot Error", err));
                    return () => unsub();
                }
            }, []);

            const handleStart = (mode) => {
                const filtered = mode === 'domestic' 
                    ? ALL_QUESTIONS.filter(q => q.category === 'domestic' || q.category === 'common')
                    : ALL_QUESTIONS.filter(q => q.category === 'boutique' || q.category === 'common');
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 20);
                setActiveQuestions(shuffled);
                setCurrentMode(mode);
                setView('quiz');
            };

            const submitResult = async () => {
                setView('result');
                if (db) {
                    try {
                        await db.collection('quiz_data_v1').add({
                            employeeId: employeeId.toUpperCase().trim(),
                            score,
                            mode: currentMode,
                            time: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (e) { console.error("Save Error", e); }
                }
            };

            const downloadImage = async () => {
                const canvas = await html2canvas(resRef.current, { scale: 3, backgroundColor: '#ffffff' });
                const link = document.createElement('a');
                link.download = `${employeeId}_成績單.png`;
                link.href = canvas.toDataURL();
                link.click();
            };

            const rankList = useMemo(() => {
                const map = new Map();
                leaderboard.forEach(item => {
                    const old = map.get(item.employeeId);
                    if (!old || item.score > old.score) map.set(item.employeeId, item);
                });
                return Array.from(map.values()).sort((a,b) => b.score - a.score);
            }, [leaderboard]);

            // --- Views ---

            if (view === 'login') return (
                <div className="quiz-container">
                    <div className="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden border">
                        <div className="bg-red-600 p-8 text-center text-white">
                            <div className="text-5xl mb-2">🏆</div>
                            <h1 className="text-2xl font-black">2026 新春銷售會考</h1>
                        </div>
                        <div className="p-8 space-y-6">
                            <input 
                                type="text" placeholder="輸入工號 / 姓名" 
                                className="w-full p-4 bg-gray-50 border-2 rounded-xl outline-none focus:border-red-500 font-bold uppercase"
                                onChange={e => setEmployeeId(e.target.value)}
                            />
                            <button 
                                onClick={() => employeeId.trim() && setView('menu')}
                                className="w-full bg-red-600 text-white py-4 rounded-xl font-black btn-active shadow-lg"
                            >開始登入</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'menu') return (
                <div className="quiz-container">
                    <div className="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl p-8 space-y-4 border">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-black text-gray-800">歡迎, {employeeId.toUpperCase()}</h2>
                        </div>
                        <button onClick={() => handleStart('domestic')} className="w-full flex items-center p-6 bg-red-50 rounded-2xl border-2 border-transparent hover:border-red-500 btn-active">
                            <span className="text-3xl mr-4">🛍️</span>
                            <div className="text-left"><p className="font-black text-lg">國產/一般組</p><p className="text-xs text-red-400">食品、來店禮回饋</p></div>
                        </button>
                        <button onClick={() => handleStart('boutique')} className="w-full flex items-center p-6 bg-amber-50 rounded-2xl border-2 border-transparent hover:border-amber-500 btn-active">
                            <span className="text-3xl mr-4">🎁</span>
                            <div className="text-left"><p className="font-black text-lg">精品/珠寶組</p><p className="text-xs text-amber-400">精品大類活動</p></div>
                        </button>
                        <button onClick={() => setView('leaderboard')} className="w-full flex items-center p-6 bg-blue-50 rounded-2xl border-2 border-transparent hover:border-blue-500 btn-active">
                            <span className="text-3xl mr-4">📊</span>
                            <div className="text-left"><p className="font-black text-lg">總成績排行榜</p></div>
                        </button>
                    </div>
                </div>
            );

            if (view === 'quiz') {
                const q = activeQuestions[currentIndex];
                return (
                    <div className="quiz-container">
                        <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden flex flex-col" style={{minHeight:'500px'}}>
                            <div className="px-6 py-4 bg-gray-50 flex justify-between font-bold text-xs border-b">
                                <span>題目 {currentIndex + 1} / 20</span>
                                <span className="text-gray-400 uppercase">{employeeId}</span>
                            </div>
                            <div className="p-8 flex-grow">
                                <h3 className="text-lg font-black text-gray-800 mb-6">{q.question}</h3>
                                <div className="space-y-3">
                                    {q.options.map((opt, i) => {
                                        let style = "w-full p-4 rounded-xl border-2 text-left font-bold transition-all ";
                                        if (isChecked) {
                                            if (i === q.correct) style += "border-green-500 bg-green-50 text-green-700";
                                            else if (i === selectedIdx) style += "border-red-500 bg-red-50 text-red-700 opacity-80";
                                            else style += "opacity-30 border-gray-100";
                                        } else style += "border-gray-100 active:bg-gray-50";
                                        return (
                                            <button key={i} onClick={() => !isChecked && (setSelectedIdx(i), setIsChecked(true), i === q.correct && setScore(score + 1))} className={style}>{opt}</button>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="p-6 bg-gray-50 border-t">
                                <button 
                                    onClick={() => currentIndex < 19 ? (setCurrentIndex(currentIndex + 1), setSelectedIdx(null), setIsChecked(false)) : submitResult()} 
                                    disabled={!isChecked}
                                    className="w-full bg-black text-white py-4 rounded-xl font-black disabled:opacity-20 btn-active"
                                >{currentIndex === 19 ? '提交結果' : '下一題'}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'result') return (
                <div className="quiz-container flex-col">
                    <div ref={resRef} className="bg-white w-full max-w-sm rounded-[3rem] shadow-2xl overflow-hidden mb-6 border">
                        <div className={`p-10 text-center text-white ${score >= 16 ? 'bg-green-600' : 'bg-red-600'}`}>
                            <div className="text-6xl mb-4">🏅</div>
                            <h2 className="text-7xl font-black mb-2">{score*5}%</h2>
                            <p className="font-bold">答對 {score} 題 / 共 20 題</p>
                            <p className="text-xs mt-2 opacity-70">測驗工號：{employeeId.toUpperCase()}</p>
                        </div>
                    </div>
                    <button onClick={downloadImage} className="w-full max-w-sm bg-blue-600 text-white py-4 rounded-xl font-black mb-3 btn-active shadow-lg">下載證書截圖</button>
                    <button onClick={() => location.reload()} className="w-full max-w-sm bg-gray-200 text-gray-600 py-4 rounded-xl font-black btn-active">返回首頁</button>
                </div>
            );

            if (view === 'leaderboard') return (
                <div className="quiz-container">
                    <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl h-[80vh] flex flex-col overflow-hidden border">
                        <div className="p-6 bg-blue-600 text-white text-center">
                            <h2 className="font-black text-xl mb-4">全體即時排行</h2>
                            <input 
                                type="text" placeholder="搜尋工號..." 
                                className="w-full p-2 rounded-lg text-black outline-none font-bold"
                                onChange={e => setSearchTerm(e.target.value.toUpperCase())}
                            />
                        </div>
                        <div className="flex-grow overflow-y-auto p-4 space-y-2">
                            {rankList.filter(i => i.employeeId.includes(searchTerm)).map((item, idx) => (
                                <div key={idx} className="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                                    <div className="flex items-center">
                                        <span className={`w-8 h-8 flex items-center justify-center rounded-full text-xs font-black mr-4 ${idx < 3 ? 'bg-yellow-400 text-white' : 'bg-gray-200 text-gray-400'}`}>{idx+1}</span>
                                        <div><p className="font-black text-gray-800">{item.employeeId}</p><p className="text-[10px] text-gray-400 uppercase">{item.mode === 'domestic' ? '國產' : '精品'}</p></div>
                                    </div>
                                    <div className="text-right"><p className="text-blue-600 font-black text-lg leading-none">{item.score} <span className="text-[10px] font-bold text-gray-300">題</span></p></div>
                                </div>
                            ))}
                        </div>
                        <div className="p-6 border-t"><button onClick={() => setView('menu')} className="w-full py-4 bg-gray-100 rounded-xl font-black btn-active">返回選單</button></div>
                    </div>
                </div>
            );

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
