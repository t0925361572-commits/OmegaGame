<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 馬上RICH吉運來 大會考</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
font-family: 'Noto Sans TC', sans-serif;
background: linear-gradient(180deg, #991b1b, #7f1d1d);
min-height: 100vh;
}
.btn-active:active { transform: scale(.96); }
.rich-card { background: rgba(255,255,255,.98); }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* Firebase */
firebase.initializeApp({
apiKey: "AIzaSyAk5ugWIjaeva-GNn54bbIJ4_V57mk__eo",
authDomain: "quiz-2dce6.firebaseapp.com",
projectId: "quiz-2dce6"
});
const db = firebase.firestore();

/* 題庫（原封不動） */
const ALL_QUESTIONS = [
{ id:'d1',category:'domestic',question:'1/10 起國產區會員買就送什麼？',options:['馬年限定紅包袋','馬年轉運貼紙','1元賀卡','無贈品'],correct:1},
{ id:'d2',category:'domestic',question:'國產區消費滿 $3,000 可折抵多少？',options:['$200','$300','$400','$500'],correct:1},
{ id:'d3',category:'domestic',question:'國產區消費滿 15,800 會送香盅嗎？',options:['會','不會','限量','看心情'],correct:1},
{ id:'d4',category:'domestic',question:'F賞100元使用規則？',options:['立即折','滿1000折','滿3000折','隔日'],correct:1},
{ id:'d5',category:'domestic',question:'$860 能用 F賞嗎？',options:['可以','不行','2000才行','主管'],correct:1},
{ id:'d6',category:'domestic',question:'$5500 可折多少？',options:['300','400','500','600'],correct:2},
{ id:'d7',category:'domestic',question:'$2538 來店禮？',options:['紅包袋','轉運貼','賀卡','香盅'],correct:1},
{ id:'d8',category:'domestic',question:'滿1880折多少？',options:['150','200','250','300'],correct:0},

{ id:'c1',category:'common',question:'滿額門檻計算？',options:['原價','折後','未稅','定價'],correct:1},
{ id:'c2',category:'common',question:'活動期間？',options:['1/1-1/31','1/10-2/24','2/1-2/14','2/10-3/10'],correct:1},
{ id:'c3',category:'common',question:'台新刷卡送？',options:['紅包','旅行組','1元發財金','行李箱'],correct:2},
{ id:'c4',category:'common',question:'滿額兌換地點？',options:['櫃位','服務台','客服','App'],correct:2},

{ id:'b1',category:'boutique',question:'精品8000折多少？',options:['500','600','650','800'],correct:2},
{ id:'b2',category:'boutique',question:'精品18000折？',options:['1200','1300','1400','1500'],correct:1}
];

const shuffle = arr => [...arr].sort(()=>Math.random()-0.5);

function App() {
const [view,setView] = useState('login');
const [employeeId,setEmployeeId] = useState('');
const [questions,setQuestions] = useState([]);
const [currentQuestionIndex,setCurrentQuestionIndex] = useState(0);
const [selected,setSelected] = useState(null);
const [checked,setChecked] = useState(false);
const [score,setScore] = useState(0);
const resultRef = useRef();

useEffect(()=>{
firebase.auth().signInAnonymously();
lucide.createIcons();
},[view,currentQuestionIndex]);

const start = mode => {
const filtered = ALL_QUESTIONS.filter(q=>q.category===mode||q.category==='common');
setQuestions(shuffle(filtered));
setScore(0);
setCurrentQuestionIndex(0);
setSelected(null);
setChecked(false);
setView('quiz');
};

const answer = i => {
if(checked) return;
setSelected(i);
setChecked(true);
if(i===questions[currentQuestionIndex].correct){
setScore(s=>s+1);
}
};

const next = ()=>{
if(currentQuestionIndex < questions.length-1){
setCurrentQuestionIndex(i=>i+1);
setSelected(null);
setChecked(false);
}else{
finish();
}
};

const finish = ()=>{
db.collection('quiz_2026_final').doc(employeeId.toUpperCase()).set({
id: employeeId.toUpperCase(),
score,
total: questions.length,
time: firebase.firestore.FieldValue.serverTimestamp()
});
setView('result');
};

const q = questions[currentQuestionIndex];

if(view==='login') return (
<div className="h-screen flex items-center justify-center">
<div className="bg-white p-10 rounded-3xl text-center space-y-5">
<h1 className="text-3xl font-black">2026 馬上RICH</h1>
<input className="border p-3 rounded-xl text-center font-bold"
placeholder="工號"
onChange={e=>setEmployeeId(e.target.value)} />
<button className="bg-red-600 text-white w-full p-4 rounded-xl"
onClick={()=>employeeId && setView('menu')}>登入</button>
</div>
</div>
);

if(view==='menu') return (
<div className="h-screen flex items-center justify-center">
<div className="bg-white p-10 rounded-3xl space-y-4">
<button onClick={()=>start('domestic')} className="w-full bg-red-100 p-5 rounded-xl font-black">國產組</button>
<button onClick={()=>start('boutique')} className="w-full bg-amber-100 p-5 rounded-xl font-black">精品組</button>
</div>
</div>
);

if(view==='quiz') return (
<div className="h-screen flex items-center justify-center">
<div className="bg-white p-8 rounded-3xl w-96">
<p className="text-xs mb-2">題目 {currentQuestionIndex+1}/{questions.length}</p>
<h2 className="font-black text-xl mb-5">{q.question}</h2>
{q.options.map((o,i)=>(
<button key={i}
onClick={()=>answer(i)}
className={`w-full p-4 mb-3 rounded-xl border
${checked && i===q.correct?'bg-green-100':
checked && i===selected?'bg-red-100':''}`}>
{o}
</button>
))}
<button disabled={!checked}
onClick={next}
className="bg-black text-white w-full p-4 rounded-xl mt-4">
{currentQuestionIndex===questions.length-1?'完成':'下一題'}
</button>
</div>
</div>
);

if(view==='result') return (
<div className="h-screen flex items-center justify-center">
<div ref={resultRef} className="bg-white p-10 rounded-3xl text-center">
<h1 className="text-5xl font-black">{Math.round(score/questions.length*100)}%</h1>
<p>{score}/{questions.length}</p>
<button onClick={()=>setView('login')}
className="mt-6 bg-red-600 text-white p-4 rounded-xl">回首頁</button>
</div>
</div>
);

return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
